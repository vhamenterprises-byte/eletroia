services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eletroia
      POSTGRES_PASSWORD: eletroia
      POSTGRES_DB: eletroia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eletroia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://eletroia:eletroia@db:5432/eletroia
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres-data:
